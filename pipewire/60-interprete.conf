# 60-interprete.conf — nodos virtuales del intérprete JA ⇄ ES.
#
# Se instala en ~/.config/pipewire/pipewire-pulse.conf.d/60-interprete.conf
# y lo gestiona scripts/interprete-audio (setup/teardown). NO editar la copia
# instalada a mano: edita este fichero del repo y vuelve a ejecutar setup.
#
# - meet_in  : salida de Meet/Teams. La app captura meet_in.monitor.
# - meet_out : destino de la TTS en japonés.
# - meet_mic : micrófono virtual (Audio/Source) que ve Meet/Teams; lleva la
#              TTS(ja) desde meet_out.monitor.
#
# El bucle meet_in.monitor -> auriculares (japonés de fondo) NO va aquí: es un
# proceso pw-loopback en systemd/user/interprete-monitor.service.

pulse.cmd = [
    { cmd = "load-module"
      args = "module-null-sink media.class=Audio/Sink sink_name=meet_in channel_map=front-left,front-right sink_properties=device.description=Meet_in" }
    { cmd = "load-module"
      args = "module-null-sink media.class=Audio/Sink sink_name=meet_out channel_map=front-left,front-right sink_properties=device.description=Meet_out" }
    { cmd = "load-module"
      args = "module-remap-source master=meet_out.monitor source_name=meet_mic channel_map=front-left,front-right source_properties=device.description=Micro_del_interprete" }
]
